name: Download trends

on:
  schedule:
    - cron: '27 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-stats.yml'
      - 'tools/download-stats.py'

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: download-stats
          path: stats
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install matplotlib==3.10.7
      - name: Fetch download counts and render chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A fine-grained token restricted to this repo with Administration read access.
          DOWNLOAD_STATS_TRAFFIC_TOKEN: ${{ secrets.DOWNLOAD_STATS_TRAFFIC_TOKEN }}
        run: python source/tools/download-stats.py stats
      - name: Save history and chart
        working-directory: stats
        run: |
          git add -- history.json trend.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: update download trends'
          git push origin HEAD:refs/heads/download-stats
